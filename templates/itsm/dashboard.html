<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matt Faulkner">
    <meta name="description" content="GoobyDesk ITSM Dashboard">
    <meta name="robots" content="noindex, nofollow"> <!--Discourage Search Engine Indexing of this page-->
    <meta name="theme-color" content="#284389"> <!-- Mobile Browser stylized address bar.-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Force IE to use latest rendering engine available.-->
    <meta http-equiv="refresh" content="600"> <!-- 10 Minute Page Refresh -->
    <link rel="preconnect" href="https://fonts.bunny.net/css">
    <link rel="preconnect" href="https://fonts.bunny.net/css" crossorigin>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Performance Enhancements -->
    <title>GoobyDesk - Technician Dashboard</title>
</head>
<body>
    <main class="container">
        <div class="logo">
            <img src="{{ url_for('static', filename='/img/logo_white.webp') }}" alt="GoobyDesk Logo">
        </div>
        <h2>Technician Dashboard</h2>
        <ul class="ticket-list">
            {% for ticket in tickets %}
                <li>
                    <a href="{{ url_for('itsm.ticket_detail', ticket_number=ticket.ticket_number) }}">
                        {{ ticket.ticket_number }} - {{ ticket.ticket_subject }} ({{ ticket.ticket_status }})
                    </a>
                </li>
            {% endfor %}
        </ul>
        <!-- Close Ticket button -->
        <div class="inline-form">
            <input type="text" id="ticketIdInput" placeholder="Close Ticket Number">
            <button class="close-tkt-btn inline-btn" onclick="closeTicket()">Close Ticket</button>
        </div>
        <br>
        <!-- Technician logout button -->
        <form action="{{ url_for('logout') }}" method="GET">
        <button type="submit" class="submit-btn">Logout</button>
        </form>
        <!-- Standard Footer Text -->
        <p class="footer-text">©2025 GoobyDesk, FOSS created by GoobyFRS | Logged In as: {{ loggedInTech }} |
            <br>
            <a href="{{ url_for('itsm.dashboard') }}">Queues</a> | <a href="{{ url_for('changes_module.changes_home') }}">Changes</a> | <a href="{{ url_for('crm_module.crm_dashboard') }}">CRM</a> | <a href="{{ url_for('hr_module.hr_dashboard') }}">HR</a> | <a href="{{ url_for('serviceid_module.serviceid_dashboard') }}">ServiceID</a> | <a href="{{ url_for('reports_module.reports_home') }}">Reports</a>
        </p>
    </main>
</body>
</html>
