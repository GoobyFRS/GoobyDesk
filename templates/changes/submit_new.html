<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matt Faulkner">
    <meta name="description" content="Create New Change">
    <meta name="robots" content="noindex, nofollow"> <!--Discourage Search Engine Indexing of this page-->
    <meta name="theme-color" content="#284389">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.bunny.net/css">
    <link rel="preconnect" href="https://fonts.bunny.net/css" crossorigin>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Create New Change - GoobyDesk</title>
</head>
<body>
    <main class="container container--narrow">
        <div class="logo">
            <img src="{{ url_for('static', filename='/img/logo_white.webp') }}" alt="GoobyDesk Logo">
        </div>
        <h2>New Change</h2>
        <p class="text-muted">Fields marked with * are required.</p>

        {% if error %}
        <div class="alert alert--danger" role="alert">{{ error }}</div>
        {% endif %}

        {% set values = form_values or {} %}

        <form method="POST" action="{{ url_for('changes_module.submit_new') }}">
            <label for="change_short_description">Short Description *</label>
            <input
                type="text"
                id="change_short_description"
                name="change_short_description"
                value="{{ values.get('change_short_description', '') }}"
                maxlength="120"
                required
            >

            <label for="change_description">Detailed Description</label>
            <textarea id="change_description" name="change_description" rows="4">{{ values.get('change_description', '') }}</textarea>

            <label for="implement_plan">Implement Plan *</label>
            <textarea id="implement_plan" name="implement_plan" rows="4" required>{{ values.get('implement_plan', '') }}</textarea>

            <label for="test_accept_plan">Test Plan *</label>
            <textarea id="test_accept_plan" name="test_accept_plan" rows="4" required>{{ values.get('test_accept_plan', '') }}</textarea>

            <label for="rollback_plan">Rollback Plan *</label>
            <textarea id="rollback_plan" name="rollback_plan" rows="4" required>{{ values.get('rollback_plan', '') }}</textarea>

            <div class="form-row">
                <div>
                    <label for="change_risk">Risk</label>
                    <select id="change_risk" name="change_risk">
                        {% set risk_value = values.get('change_risk', 'medium')|lower %}
                        <option value="low" {% if risk_value == 'low' %}selected{% endif %}>Low</option>
                        <option value="medium" {% if risk_value == 'medium' %}selected{% endif %}>Medium</option>
                        <option value="high" {% if risk_value == 'high' %}selected{% endif %}>High</option>
                    </select>
                </div>
                <div>
                    <label for="planned_start_timestamp">Planned Start *</label>
                    <input
                        type="datetime-local"
                        id="planned_start_timestamp"
                        name="planned_start_timestamp"
                        value="{{ values.get('planned_start_timestamp', '') }}"
                        required
                    >
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="planned_end_timestamp">Planned End *</label>
                    <input
                        type="datetime-local"
                        id="planned_end_timestamp"
                        name="planned_end_timestamp"
                        value="{{ values.get('planned_end_timestamp', '') }}"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Change</button>
            <a href="{{ url_for('changes_module.changes_home') }}" class="form-link">Cancel</a>
        </form>
    </main>
</body>
</html>
